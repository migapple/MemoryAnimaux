<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Memo Animaux Kids</title>
<style>
  :root {
    --ink: #1a0a2e;
    --gold: #e8b84b;
    --gold2: #f5d07a;
    --bg: #0d0820;
    --card-back: #1e1040;
    --card-border: #3a2070;
    --green: #4caf50;
    --red: #e74c3c;
    --blue: #3a86ff;
    --purple: #9b59b6;
    --fs: 1;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Segoe UI',system-ui,sans-serif;}
  #app{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;}

  /* HEADER */
  .header{
    padding-top:calc(14px + env(safe-area-inset-top));
    padding-bottom:10px;
    padding-left:14px;padding-right:14px;
    background:var(--bg);
    flex-shrink:0;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid rgba(232,184,75,0.2);
  }
  .header-left{display:flex;align-items:center;gap:10px;}
  .app-title{font-size:calc(18px * var(--fs));font-weight:800;color:var(--gold);letter-spacing:0.5px;}
  .app-subtitle{font-size:calc(11px * var(--fs));color:rgba(232,184,75,0.6);margin-top:1px;}
  .header-right{display:flex;gap:8px;align-items:center;}

  .btn-icon{
    width:36px;height:36px;border-radius:50%;
    background:rgba(232,184,75,0.12);border:1px solid rgba(232,184,75,0.3);
    color:var(--gold);font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .btn-icon:active{background:rgba(232,184,75,0.25);}

  /* SCORE BAR */
  .scorebar{
    padding:8px 14px;background:rgba(255,255,255,0.03);
    display:flex;align-items:center;justify-content:space-between;
    flex-shrink:0;
  }
  .score-item{display:flex;flex-direction:column;align-items:center;}
  .score-label{font-size:calc(9px * var(--fs));color:rgba(232,184,75,0.5);text-transform:uppercase;letter-spacing:1px;}
  .score-val{font-size:calc(20px * var(--fs));font-weight:800;color:var(--gold);}
  .score-val.green{color:var(--green);}
  .score-val.red{color:var(--red);}

  /* MAIN */
  .main{flex:1;overflow-y:auto;padding:10px 8px calc(10px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;}

  /* DIFFICULTY SELECTOR */
  .difficulty{display:flex;gap:8px;margin:0 0 12px;justify-content:center;}
  .diff-btn{
    padding:6px 16px;border-radius:20px;font-size:calc(12px * var(--fs));font-weight:700;
    border:1.5px solid rgba(232,184,75,0.3);background:transparent;color:rgba(232,184,75,0.6);cursor:pointer;
  }
  .diff-btn.active{background:var(--gold);color:var(--ink);border-color:var(--gold);}
  .diff-btn:active{transform:scale(0.95);}

  /* GRID */
  .grid{
    display:grid;
    gap:8px;
    justify-content:center;
  }
  .grid.d4{grid-template-columns:repeat(4,1fr);}
  .grid.d5{grid-template-columns:repeat(5,1fr);}
  .grid.d6{grid-template-columns:repeat(6,1fr);}

  /* CARD */
  .card{
    aspect-ratio:1;
    perspective:600px;
    cursor:pointer;
  }
  .card-inner{
    width:100%;height:100%;
    position:relative;
    transform-style:preserve-3d;
    transition:transform 0.35s cubic-bezier(.4,0,.2,1);
    border-radius:14px;
  }
  .card.flipped .card-inner{transform:rotateY(180deg);}
  .card.matched .card-inner{transform:rotateY(180deg);}

  .card-face{
    position:absolute;inset:0;
    border-radius:14px;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;
    overflow:hidden;
  }
  .card-back{
    background:var(--card-back);
    border:2px solid var(--card-border);
  }
  .card-back-emoji{font-size:28px;opacity:0.35;}
  .card-back-pattern{
    position:absolute;inset:0;
    background:
      repeating-linear-gradient(45deg,transparent,transparent 8px,rgba(58,32,112,0.4) 8px,rgba(58,32,112,0.4) 9px);
    border-radius:12px;
  }

  .card-front{
    background:linear-gradient(135deg,#1e1040,#2d1a60);
    border:2px solid var(--gold);
    transform:rotateY(180deg);
    flex-direction:column;gap:4px;
    padding:4px;
  }
  .card-emoji{font-size:clamp(24px,6vw,42px);line-height:1;}
  .card-name{
    font-size:clamp(8px,2vw,13px);font-weight:700;
    color:var(--gold2);text-align:center;
    line-height:1.1;
  }

  .card.matched .card-front{
    border-color:var(--green);
    background:linear-gradient(135deg,#0d2010,#1a4020);
    animation:matchPop 0.4s ease;
  }
  @keyframes matchPop{
    0%{transform:rotateY(180deg) scale(1);}
    50%{transform:rotateY(180deg) scale(1.12);}
    100%{transform:rotateY(180deg) scale(1);}
  }
  .card.wrong .card-front{
    border-color:var(--red);
    animation:shake 0.4s ease;
  }
  @keyframes shake{
    0%,100%{transform:rotateY(180deg) translateX(0);}
    25%{transform:rotateY(180deg) translateX(-6px);}
    75%{transform:rotateY(180deg) translateX(6px);}
  }

  /* WIN SCREEN */
  .win-screen{
    position:fixed;inset:0;z-index:100;
    background:rgba(13,8,32,0.95);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:30px;
    animation:fadeIn 0.4s ease;
  }
  @keyframes fadeIn{from{opacity:0;transform:scale(0.9);}to{opacity:1;transform:scale(1);}}
  .win-emoji{font-size:72px;animation:bounce 1s infinite;}
  @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
  .win-title{font-size:calc(28px * var(--fs));font-weight:900;color:var(--gold);text-align:center;}
  .win-sub{font-size:calc(14px * var(--fs));color:rgba(232,184,75,0.7);text-align:center;}
  .win-stats{display:flex;gap:20px;}
  .win-stat{display:flex;flex-direction:column;align-items:center;
    background:rgba(232,184,75,0.1);padding:12px 20px;border-radius:16px;border:1px solid rgba(232,184,75,0.25);}
  .win-stat-val{font-size:calc(26px * var(--fs));font-weight:900;color:var(--gold);}
  .win-stat-lbl{font-size:calc(10px * var(--fs));color:rgba(232,184,75,0.6);}
  .btn-play-again{
    background:var(--gold);color:var(--ink);
    padding:14px 36px;border-radius:50px;
    font-size:calc(16px * var(--fs));font-weight:900;
    border:none;cursor:pointer;
    box-shadow:0 4px 20px rgba(232,184,75,0.4);
  }
  .btn-play-again:active{transform:scale(0.96);}

  /* CONFETTI CANVAS */
  #confettiCanvas{
    position:fixed;inset:0;z-index:99;
    pointer-events:none;
    display:none;
  }

  /* HIDDEN */
  .hidden{display:none!important;}
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <div>
        <div class="app-title">🐾 Memo Animaux Kids</div>
        <div class="app-subtitle" id="sub">Retrouve les paires !</div>
      </div>
    </div>
    <div class="header-right">
      <button class="btn-icon" id="btnSound" onclick="toggleSound()" title="Son">🔊</button>
      <button class="btn-icon" id="btnLang" onclick="toggleLang()">🇬🇧</button>
    </div>
  </div>

  <!-- SCORE BAR -->
  <div class="scorebar">
    <div class="score-item">
      <div class="score-label" id="lbl-pairs">Paires</div>
      <div class="score-val green" id="val-found">0</div>
    </div>
    <div class="score-item">
      <div class="score-label" id="lbl-tries">Essais</div>
      <div class="score-val" id="val-tries">0</div>
    </div>
    <div class="score-item">
      <div class="score-label" id="lbl-best">Meilleur</div>
      <div class="score-val" style="color:var(--purple);" id="val-best">—</div>
    </div>
    <button class="btn-icon" onclick="newGame()" style="font-size:18px;" title="Nouvelle partie">🔄</button>
    <button class="btn-icon" onclick="clearScores()" style="font-size:16px;" title="Effacer scores">🗑️</button>
  </div>

  <!-- DIFFICULTY -->
  <div class="main" id="mainArea">
    <div class="difficulty">
      <button class="diff-btn active" id="d4btn" onclick="setDiff(4)">😊 Facile</button>
      <button class="diff-btn" id="d5btn" onclick="setDiff(5)">🤔 Moyen</button>
      <button class="diff-btn" id="d6btn" onclick="setDiff(6)">🔥 Difficile</button>
    </div>
    <div class="grid d4" id="grid"></div>
  </div>
</div>

<!-- CONFETTI -->
<canvas id="confettiCanvas"></canvas>

<!-- WIN SCREEN -->
<div class="win-screen hidden" id="winScreen">
  <div class="win-emoji">🎉</div>
  <div class="win-title" id="win-title">Bravo !</div>
  <div class="win-sub" id="win-sub">Tu as trouvé toutes les paires !</div>
  <div class="win-stats">
    <div class="win-stat">
      <div class="win-stat-val" id="win-tries">0</div>
      <div class="win-stat-lbl" id="win-tries-lbl">Essais</div>
    </div>
    <div class="win-stat">
      <div class="win-stat-val" id="win-score">0</div>
      <div class="win-stat-lbl" id="win-score-lbl">Score</div>
    </div>
  </div>
  <button class="btn-play-again" id="win-btn" onclick="newGame();hideWin();">🔄 Rejouer</button>
</div>

function playSound(name) {
  if (!soundOn) return;
  try {
    var s = SND[name];
    s.currentTime = 0;
    s.play();
  } catch(e) {}
}

function playFlip()  { playSound('flip');  }
function playMatch() { playSound('match'); }
function playWrong() { playSound('wrong'); }
function playWin()   { playSound('win');   }

function toggleSound() {
  soundOn = !soundOn;
  var btn = document.getElementById('btnSound');
  btn.textContent = soundOn ? '🔊' : '🔇';
  btn.classList.toggle('muted', !soundOn);
  if (soundOn) playFlip();
}

// ── CONFETTI ───────────────────────────────────────────────────────────────
const COLORS = ['#e8b84b','#f5d07a','#4caf50','#3a86ff','#ff6b6b','#fff','#c084fc'];
let confettiPieces = [];
let confettiRAF = null;

function startConfetti(){
  const canvas = document.getElementById('confettiCanvas');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  canvas.style.display = 'block';
  confettiPieces = [];
  for(let i = 0; i < 120; i++){
    confettiPieces.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      w: Math.random() * 10 + 6,
      h: Math.random() * 6 + 4,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      rot: Math.random() * Math.PI * 2,
      vx: (Math.random() - 0.5) * 3,
      vy: Math.random() * 4 + 2,
      vr: (Math.random() - 0.5) * 0.2,
    });
  }
  animateConfetti();
  setTimeout(stopConfetti, 3500);
}

function animateConfetti(){
  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  confettiPieces.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    ctx.save();
    ctx.translate(p.x + p.w/2, p.y + p.h/2);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.y < canvas.height ? 1 : Math.max(0, 1 - (p.y - canvas.height) / 80);
    ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    ctx.restore();
  });
  confettiPieces = confettiPieces.filter(p => p.y < canvas.height + 100);
  if(confettiPieces.length > 0){
    confettiRAF = requestAnimationFrame(animateConfetti);
  } else {
    stopConfetti();
  }
}

function stopConfetti(){
  if(confettiRAF){ cancelAnimationFrame(confettiRAF); confettiRAF = null; }
  const canvas = document.getElementById('confettiCanvas');
  canvas.style.display = 'none';
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

  lang = lang === 'fr' ? 'en' : 'fr';
  applyLang();
}

// ── DIFFICULTY ─────────────────────────────────────────────────────────────
function setDiff(d){
  diff = d;
  ['4','5','6'].forEach(x => document.getElementById('d'+x+'btn').classList.remove('active'));
  document.getElementById('d'+d+'btn').classList.add('active');
  document.getElementById('grid').className = 'grid d'+d;
  newGame();
}

// ── GAME LOGIC ─────────────────────────────────────────────────────────────
function shuffle(arr){ return arr.sort(() => Math.random() - 0.5); }

function newGame(){
  const n = PAIRS[diff];
  const pool = shuffle([...ANIMALS]).slice(0, n);
  const deck = shuffle([...pool, ...pool].map((a, i) => ({...a, uid: i})));
  cards = deck;
  flipped = [];
  matched = 0;
  tries = 0;
  locked = false;
  updateScorebar();
  renderGrid();
  document.getElementById('winScreen').classList.add('hidden');
}

function renderGrid(){
  const g = document.getElementById('grid');
  g.innerHTML = '';
  cards.forEach((card, idx) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.idx = idx;
    el.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-back">
          <div class="card-back-pattern"></div>
          <div class="card-back-emoji">🐾</div>
        </div>
        <div class="card-face card-front">
          <div class="card-emoji">${card.emoji}</div>
          <div class="card-name" data-id="${card.id}">${card[lang]}</div>
        </div>
      </div>`;
    // ontouchend : déclenche Audio.play() dans le geste direct iOS
    el.ontouchend = function(e) {
      e.preventDefault();
      // Si c'est la 2e carte, on joue le son immédiatement dans le geste (iOS)
      if (!locked && !cards[idx].matched && !flipped.includes(idx) && flipped.length === 1) {
        const other = cards[flipped[0]];
        if (other.id === cards[idx].id) {
          setTimeout(() => playMatch(), 820);
        } else {
          setTimeout(() => playWrong(), 820);
        }
      }
      flipCard(idx);
    };
    // fallback souris desktop
    el.onclick = function(e) {
      if (e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) return;
      flipCard(idx);
    };
    g.appendChild(el);
  });
}

function flipCard(idx){
  if(locked) return;
  if(cards[idx].matched) return;
  if(flipped.includes(idx)) return;
  if(flipped.length >= 2) return;

  const el = getCardEl(idx);
  el.classList.add('flipped');
  flipped.push(idx);

  if(flipped.length === 2){
    tries++;
    updateScorebar();
    locked = true;
    setTimeout(checkMatch, 800);
  }
}

function checkMatch(){
  const [a, b] = flipped;
  const ca = cards[a], cb = cards[b];
  if(ca.id === cb.id){
    // match!
    ca.matched = cb.matched = true;
    getCardEl(a).classList.add('matched');
    getCardEl(b).classList.add('matched');
    matched++;
    updateScorebar();
    if(matched === PAIRS[diff]) setTimeout(showWin, 500);
  } else {
    // no match
    getCardEl(a).classList.add('wrong');
    getCardEl(b).classList.add('wrong');
    setTimeout(() => {
      getCardEl(a).classList.remove('flipped','wrong');
      getCardEl(b).classList.remove('flipped','wrong');
    }, 400);
  }
  flipped = [];
  locked = false;
}

function getCardEl(idx){
  return document.querySelector(`.card[data-idx="${idx}"]`);
}

function updateScorebar(){
  document.getElementById('val-found').textContent = matched + '/' + PAIRS[diff];
  document.getElementById('val-tries').textContent = tries;
  const k = diff;
  const b = bestScore[k];
  document.getElementById('val-best').textContent = b ? b : '—';
}

function showWin(){
  const score = Math.max(100, 300 - (tries - PAIRS[diff]) * 10);
  const k = diff;
  if(!bestScore[k] || tries < bestScore[k]) {
    bestScore[k] = tries;
    try { localStorage.setItem('memory_best', JSON.stringify(bestScore)); } catch(e) {}
  }
  document.getElementById('win-tries').textContent = tries;
  document.getElementById('win-score').textContent = score;
  document.getElementById('winScreen').classList.remove('hidden');
  playWin();
  startConfetti();
}

function hideWin(){
  document.getElementById('winScreen').classList.add('hidden');
  stopConfetti();
}

function clearScores(){
  bestScore = {};
  try { localStorage.removeItem('memory_best'); } catch(e) {}
  updateScorebar();
}

// ── INIT ───────────────────────────────────────────────────────────────────
newGame();
applyLang();
</script>
</body>
</html>
